name: Build onnxruntime wheel

on:
  workflow_dispatch:
    inputs:
      ort_version:
        description: "onnxruntime tag to build"
        default: "v1.31.0"
      python_version:
        description: "Python version to build for"
        default: "3.15"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: ${{ inputs.ort_version }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          allow-prereleases: true

      - name: Install build dependencies
        run: python -m pip install --upgrade pip wheel setuptools packaging numpy flatbuffers protobuf sympy ninja

      - name: Build wheel
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          call .\build.bat --config Release --build_wheel --parallel %NUMBER_OF_PROCESSORS% --skip_tests --compile_no_warning_as_error --cmake_generator Ninja

      - uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-wheel-${{ inputs.python_version }}
          path: build/Windows/**/dist/*.whl
          if-no-files-found: error
