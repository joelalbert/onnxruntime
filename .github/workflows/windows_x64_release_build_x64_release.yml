name: build_windows_x64_py315_wheel

on:
  push:
    branches: [main, 'rel-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build_wheel:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          architecture: x64

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Install build prerequisites
        shell: cmd
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy pytest

      - name: Build ONNX Runtime Wheel
        shell: pwsh
        run: |
          python.exe "${{ github.workspace }}\tools\ci_build\build.py" `
            --config Release `
            --build_dir "${{ github.workspace }}\build" `
            --skip_submodule_sync `
            --parallel `
            --cmake_generator "Visual Studio 17 2022" `
            --build_wheel
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Wheel Installation
        shell: pwsh
        run: |
          python -m pip uninstall -y onnxruntime onnxruntime-gpu onnxruntime-training -qq
          Get-ChildItem -Path ${{ github.workspace }}\build\Release\Release\dist\*.whl | ForEach-Object {
            pip --disable-pip-version-check install --upgrade $_.FullName
          }
          python -c "import onnxruntime; print('ONNX Runtime version:', onnxruntime.__version__)"

      - name: Upload Python Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-py315-win-x64-wheel
          path: ${{ github.workspace }}/build/Release/Release/dist/*.whl
